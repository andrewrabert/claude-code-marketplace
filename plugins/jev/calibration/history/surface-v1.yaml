# Rust surface spec review: one declaration at a time, before any body exists.
# State: the change's description, every declaration the spec adds, and the declaration under review.
# Decision in code: a question is a finding at >= the threshold in surface-v1.gates.json. Uncalibrated.

raw-mechanism-type:
  type: noul
  instructions:
    task: Judge only the declaration under review. Bodies are omitted by design.
    statement: A field, parameter or return type in the declaration uses a raw mechanism type where a type for the domain concept belongs.
  criteria:
    'true': >-
      The declaration carries a domain concept as a primitive or generic container: an integer
      id, index or flag, a String key or name, a bool mode, a tuple, an Option or Vec of raw
      values, or a map, where a named struct, newtype or enum for that concept would carry its
      meaning and its invariants.
    'false': >-
      Every field, parameter and return type names the concept it holds, or the declaration sits
      at an FFI or serialization boundary whose types are fixed by the other side.
failure-outside-result:
  type: noul
  instructions:
    task: Judge only the declaration under review. Bodies are omitted by design.
    statement: The declaration's signature reports a failure through something other than Result.
  criteria:
    'true': >-
      A function that can fail returns bool, Option, a sentinel number, an empty collection or a
      status value to say that it failed, or returns nothing where a failure has to reach the
      caller.
    'false': >-
      Every function that can fail returns Result with an error type, an Option return means a
      value that is ordinarily absent, or the declaration has no fallible function.
predicate-classifies:
  type: noul
  instructions:
    task: Judge only the declaration under review. Bodies are omitted by design.
    statement: The declaration returns or takes a bool that says which kind a value is, where an enum or a typed value would carry that kind.
  criteria:
    'true': >-
      The declaration is a predicate such as is_kind(&x) -> bool, takes a filter of type
      impl Fn(T) -> bool, or has a bool field that tells two kinds of the same thing apart, so
      callers decide the kind again at each use.
    'false': >-
      The kind is a variant of an enum or a distinct type decided once, or the bool is plain state
      of one value, such as whether it is enabled.
option-means-absence:
  type: noul
  instructions:
    task: Judge only the declaration under review. Bodies are omitted by design.
    statement: An Option in the declaration stands for something other than a value being absent.
  criteria:
    'true': >-
      An Option field, parameter or return type encodes a state, a mode, "not computed yet", "use
      the default", or one of several kinds, or two Options in the declaration are set together
      or exclusively.
    'false': >-
      Every Option means only that the value may be absent, or the declaration has no Option.
forgettable-check:
  type: noul
  instructions:
    task: Judge only the declaration under review. Bodies are omitted by design.
    statement: The declaration makes callers remember a check before a value is safe to use, where a type could enforce it.
  criteria:
    'true': >-
      The declaration hands out a value together with a separate validity flag, status field,
      is_valid method or index that callers must check before using the value, and nothing in the
      types stops a caller from skipping it.
    'false': >-
      Every value is usable as soon as it exists, or the types force the check: a private
      constructor, an enum, or a Result the caller must handle.
default-outside-owner:
  type: noul
  instructions:
    task: Judge only the declaration under review. Bodies are omitted by design.
    statement: The declaration exposes a specific default or fallback choice outside the module that owns it.
  criteria:
    'true': >-
      The declaration is a public constructor, function or field for one specific default or
      fallback value, so code outside the owning module can pick or repeat the default itself.
    'false': >-
      The default stays private to its module and callers reach it only through a function that
      decides and returns the value, or the declaration exposes no default.
needless-layer:
  type: noul
  instructions:
    task: Judge only the declaration under review. Bodies are omitted by design.
    statement: The declaration only forwards to, wraps or repeats another declaration in the spec.
  criteria:
    'true': >-
      The declaration is a function, method, struct or trait whose signature restates another
      declaration in the spec, wraps one type in another without adding meaning, or adds a step
      that callers could skip by using the other declaration directly.
    'false': >-
      The declaration adds a concept, a constraint or a capability that no other declaration in
      the spec provides.
speculative-generality:
  type: noul
  instructions:
    task: Judge only the declaration under review. Bodies are omitted by design.
    statement: The declaration generalizes over choices that the described change does not need.
  criteria:
    'true': >-
      The declaration adds a trait, a type parameter, a configuration struct, an extra parameter or
      a variant for cases that the description and the rest of the spec never use, so only one
      choice exists in practice.
    'false': >-
      Every parameter, type parameter and variant serves a case the description or another
      declaration in the spec uses.
not-in-description:
  type: noul
  instructions:
    task: Judge only the declaration under review. Bodies are omitted by design.
    statement: The described change does not need the declaration under review.
  criteria:
    'true': >-
      The declaration serves a goal the description does not state, and no other declaration in
      the spec uses it, so the change would be complete without it.
    'false': >-
      The declaration serves the change the description states, directly or through another
      declaration in the spec that uses it.
name-misses-concept:
  type: noul
  instructions:
    task: Judge only the declaration under review. Bodies are omitted by design.
    statement: A name in the declaration is a generic or invented term where the description or the spec names the domain concept.
  criteria:
    'true': >-
      A type, function, field, parameter or variant is named with a vague word such as data, info,
      item, entry, record, kind, helper, handler or manager, or with a term the description never
      uses, where the description or another declaration names the concept it holds.
    'false': >-
      Every name in the declaration says which domain thing it is, in the terms the description
      and the rest of the spec use.
